name: Build Kaagaz Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21
        id: setup-java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies & Capacitor
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps

      - name: Prepare Web Build for Mobile Offline
        shell: node {0}
        run: |
          const fs = require('fs');
          const path = require('path');

          if (fs.existsSync('index.html')) {
            let html = fs.readFileSync('index.html', 'utf8');
            html = html.replace(/<script\s+type=["']importmap["'][\s\S]*?<\/script>/gi, '');
            fs.writeFileSync('index.html', html);
          }

          function walkAll(dir) {
            for (const file of fs.readdirSync(dir)) {
              if (['node_modules', '.git', 'dist', 'release', 'electron', 'android'].includes(file)) continue;
              const full = path.join(dir, file);
              if (fs.statSync(full).isDirectory()) walkAll(full);
              else if (/\.(tsx|ts|jsx|js)$/.test(file)) {
                let code = fs.readFileSync(full, 'utf8');
                if (code.includes('BrowserRouter')) {
                  code = code.replace(/BrowserRouter/g, 'HashRouter');
                  fs.writeFileSync(full, code);
                }
              }
            }
          }
          walkAll('.');

      - name: Build Web & Android APK
        env:
          JAVA_HOME: ${{ steps.setup-java.outputs.path }}
        run: |
          npx vite build --base=./
          export PATH="$JAVA_HOME/bin:$PATH"
          rm -rf android capacitor.config.json capacitor.config.ts
          npx cap init "Kaagaz" "com.kaagaz.pdftoolkit" --web-dir=dist
          npx cap add android
          npx cap sync android
          echo "org.gradle.java.home=$JAVA_HOME" >> android/gradle.properties
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Kaagaz-Offline.apk

      - name: Publish Android APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v1.0.${{ github.run_number }}
          name: Kaagaz Android APK v1.0.${{ github.run_number }} (Offline)
          draft: false
          prerelease: false
          files: |
            Kaagaz-Offline.apk
