name: Build & Publish Kaagaz Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install --save-dev electron electron-builder --legacy-peer-deps

      - name: Auto-Fix White Screen & Configure Offline Paths
        shell: node {0}
        run: |
          const fs = require('fs');
          const path = require('path');

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = '1.0.1';
          pkg.main = 'electron/main.cjs';
          pkg.build = {
            appId: 'com.kaagaz.pdftoolkit',
            productName: 'Kaagaz',
            directories: { output: 'release' },
            files: ['dist/**/*', 'electron/**/*', 'package.json'],
            win: {
              target: ['portable', 'nsis'],
              signAndEditExecutable: false
            }
          };
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));

          // Force relative base path in vite.config
          for (const cfg of ['vite.config.ts', 'vite.config.js']) {
            if (fs.existsSync(cfg)) {
              let content = fs.readFileSync(cfg, 'utf8');
              if (content.includes('base:')) {
                content = content.replace(/base:\s*['"][^'"]*['"]/, "base: './'");
              } else {
                content = content.replace(/defineConfig\s*\(\s*(\([^)]*\)\s*=>\s*)?\{/, (m) => `${m}\n  base: './',`);
              }
              fs.writeFileSync(cfg, content);
            }
          }

          // Replace BrowserRouter with HashRouter in src files if present
          function walkDir(dir) {
            if (!fs.existsSync(dir)) return;
            for (const file of fs.readdirSync(dir)) {
              const full = path.join(dir, file);
              if (fs.statSync(full).isDirectory()) walkDir(full);
              else if (/\.(tsx|ts|jsx|js)$/.test(file)) {
                let code = fs.readFileSync(full, 'utf8');
                if (code.includes('BrowserRouter')) {
                  code = code.replace(/BrowserRouter/g, 'HashRouter');
                  fs.writeFileSync(full, code);
                }
              }
            }
          }
          walkDir('src');

      - name: Build Web & Windows EXE
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          npx vite build --base=./
          npx electron-builder --win portable nsis --publish never

      - name: Publish EXE to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Kaagaz v1.0.${{ github.run_number }} (Offline Windows EXE)
          draft: false
          prerelease: false
          files: |
            release/*.exe
