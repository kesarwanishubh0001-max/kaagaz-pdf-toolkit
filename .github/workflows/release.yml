name: Build & Publish Kaagaz Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies & Electron
        run: |
          npm install
          npm install --save-dev electron electron-builder

      - name: Build Offline Windows EXE
        run: npm run build:exe

      - name: Publish EXE to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Kaagaz v1.0.${{ github.run_number }} (Offline Windows EXE)
          draft: false
          prerelease: false
          files: |
            release/*.exe
