name: Build & Publish Kaagaz Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install --save-dev electron electron-builder --legacy-peer-deps

      - name: Configure Offline Paths & Package.json
        shell: node {0}
        run: |
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.main = 'electron/main.cjs';
          pkg.build = {
            appId: 'com.kaagaz.pdftoolkit',
            productName: 'Kaagaz',
            directories: { output: 'release' },
            files: ['dist/**/*', 'electron/**/*', 'package.json'],
            win: { target: ['portable', 'nsis'] }
          };
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));

          for (const cfg of ['vite.config.ts', 'vite.config.js']) {
            if (fs.existsSync(cfg)) {
              let content = fs.readFileSync(cfg, 'utf8');
              if (!content.includes("base:")) {
                content = content.replace(/defineConfig\s*\(\s*\{/, "defineConfig({\n  base: './',");
                fs.writeFileSync(cfg, content);
              }
            }
          }

      - name: Build Web & Windows EXE
        run: |
          npm run build
          npx electron-builder --win portable nsis

      - name: Publish EXE to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Kaagaz v1.0.${{ github.run_number }} (Offline Windows EXE)
          draft: false
          prerelease: false
          files: |
            release/*.exe
